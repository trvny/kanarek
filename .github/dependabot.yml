version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: "gradle"
    directory: /
    schedule: { interval: weekly }
    groups:
      androidx:
        patterns: ["androidx*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: "npm"
    directory: /worker
    schedule: { interval: weekly }
