name: Gradle dependency graph
description: >-
  Resolves the Gradle dependency tree and either uploads it as an artifact or submits it to
  GitHub's dependency graph. Exists so the pull-request and main-branch jobs differ only in the
  one thing that must differ between them: whether a write-capable token is in scope.

inputs:
  mode:
    description: >-
      generate-and-upload for pull requests, generate-and-submit for pushes to main. The caller
      is responsible for granting contents:write only alongside the latter.
    required: true

runs:
  using: composite
  steps:
    # No checkout here: a local `uses: ./...` only resolves once the caller has checked the
    # repository out, so doing it again would just re-clone over the caller's copy.
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Read the Gradle version from the wrapper properties
      id: gradle
      shell: bash
      run: .github/scripts/gradle-version.sh

    - name: Resolve the dependency graph
      uses: gradle/actions/dependency-submission@v6
      with:
        # gradle-version downloads Gradle directly, so this action does not need the wrapper
        # jar regenerated the way the build job does.
        gradle-version: ${{ steps.gradle.outputs.version }}
        dependency-graph: ${{ inputs.mode }}
        additional-arguments: --no-configuration-cache --stacktrace
