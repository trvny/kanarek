name: Gradle dependency graph
description: >-
  Resolves the Gradle dependency tree and either uploads it as an artifact or submits it to
  GitHub's dependency graph. Exists so the pull-request and main-branch jobs differ only in the
  one thing that must differ between them: whether a write-capable token is in scope.

inputs:
  mode:
    description: >-
      generate-and-upload for pull requests, generate-and-submit for pushes to main. The caller
      is responsible for granting contents:write only alongside the latter.
    required: true

runs:
  using: composite
  steps:
    # No checkout here: a local `uses: ./...` only resolves once the caller has checked the
    # repository out, so doing it again would just re-clone over the caller's copy.
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Read the Gradle version from the wrapper properties
      id: gradle
      shell: bash
      run: .github/scripts/gradle-version.sh

    - name: Resolve the dependency graph
      uses: gradle/actions/dependency-submission@v6
      with:
        # gradle-version downloads Gradle directly, so this action does not need the wrapper
        # jar regenerated the way the build job does.
        gradle-version: ${{ steps.gradle.outputs.version }}
        dependency-graph: ${{ inputs.mode }}
        # Report only what reaches a user. Measured 22.08.2026: all 49 alerts this graph
        # first produced were against build tooling -- 40 netty via AGP's Unified Test
        # Platform, the rest via androidLintTool, unit-test classpaths and the buildscript.
        # Zero of the 14 flagged packages appear in playReleaseRuntimeClasspath or
        # fossReleaseRuntimeClasspath, and AGP 9.3.1 still pins netty 4.1.110, so there is
        # no upstream fix to take either.
        #
        # The cost of this line is real and deliberate: a CVE in a build tool -- the Kotlin
        # Gradle plugin, lint -- will no longer raise an alert here. That is a build-integrity
        # risk traded against 97 alerts across two repositories that bury anything genuine.
        # Delete the line to get the broad view back.
        #
        # `[Rr]` is not decoration: without a flavour AGP names the configuration
        # `releaseRuntimeClasspath`, lowercase, and `.*ReleaseRuntimeClasspath` matches it
        # zero times -- which would submit an empty graph and suppress everything, the
        # opposite of the intent. The upstream docs use the same `[Tt]` idiom. The leading
        # `[a-z]*` picks up flavours (`play`, `foss`) while the anchors keep out
        # `androidTest…ReleaseRuntimeClasspath` and the unit-test variants.
        dependency-graph-include-configurations: ^[a-z]*[Rr]eleaseRuntimeClasspath$
        additional-arguments: --no-configuration-cache --stacktrace
