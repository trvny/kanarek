---
FLAVOR_SUGGESTIONS: false
SECURITY_SUGGESTIONS: false
APPLY_FIXES: all
LINTER_RULES_PATH: ".github/linters"
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false

DISABLE:
  - SPELL
  - COPYPASTE

# Keep TruffleHog's default verified-secret scan; the Android and Worker jobs
# already cover build/type checks, so avoid duplicating heavyweight scanners.
DISABLE_LINTERS:
  - REPOSITORY_CHECKOV
  - REPOSITORY_GIT_DIFF
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_GRYPE
  - REPOSITORY_LS_LINT
  - REPOSITORY_OSV_SCANNER
  - REPOSITORY_SECRETLINT
  - REPOSITORY_SEMGREP
  - REPOSITORY_SYFT
  - REPOSITORY_TRIVY
  - REPOSITORY_TRIVY_SBOM

ACTION_ZIZMOR_ARGUMENTS:
  - "--offline"
  - "--min-severity=low"

KOTLIN_DETEKT_CONFIG_FILE: "detekt-config.yml"
KOTLIN_DETEKT_ARGUMENTS:
  - "--build-upon-default-config"

# Existing Kotlin/yamllint findings stay visible without making the new lint
# workflow a cleanup project. Android lint remains blocking in Android CI.
DISABLE_ERRORS_LINTERS:
  - KOTLIN_DETEKT
  - YAML_YAMLLINT

FILTER_REGEX_EXCLUDE: "(app/build/|build/|worker/node_modules/|package-lock\\.json)"
