name: Android CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore: ["worker/**", "docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["worker/**", "docs/**", "**/*.md"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Generate Gradle wrapper if missing
        # Only gradle-wrapper.properties is tracked; the jar and the gradlew scripts are
        # regenerated so no prebuilt binary lives in the repository. F-Droid does the same
        # thing on its side, which is why leaving them out is deliberate.
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.6.1
          fi

      - name: Build, test & lint
        # Flavor-qualified tasks: with product flavors (play/foss) AGP no longer creates
        # plain testDebugUnitTest/lintDebug. Unit tests and lint run on play (superset of
        # sources); fossDebug is assembled too so a GMS reference leaking into main/foss
        # sources fails CI immediately.
        run: ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kanarek-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn
