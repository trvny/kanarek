name: Android CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore: ["worker/**", "docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["worker/**", "docs/**", "**/*.md"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Read the Gradle version from the wrapper properties
        id: gradle
        # gradle-wrapper.properties is the single source of truth, because that is the file
        # Dependabot bumps. Hard-coding the version here instead would make those bumps a
        # no-op: setup-gradle would install the old version and the wrapper regeneration
        # below would rewrite the properties file back, so CI would go green without ever
        # building against the new Gradle.
        run: |
          version=$(sed -n 's#^distributionUrl=.*/gradle-\([0-9][A-Za-z0-9.-]*\)-\(bin\|all\)\.zip$#\1#p' \
            gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$version" ]; then
            echo "::error::could not parse a Gradle version out of gradle-wrapper.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Gradle $version"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        # Only gradle-wrapper.properties is tracked; the jar and the gradlew scripts are
        # regenerated so no prebuilt binary lives in the repository. F-Droid does the same
        # thing on its side, which is why leaving them out is deliberate.
        # Via env, not ${{ }} interpolation: the value comes out of a repository file, and on
        # a pull_request from a fork that file is attacker-controlled. The charset in the
        # regex above already rejects shell metacharacters; this makes the step safe even if
        # that regex is later loosened.
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Build, test & lint
        # Flavor-qualified tasks: with product flavors (play/foss) AGP no longer creates
        # plain testDebugUnitTest/lintDebug. Unit tests and lint run on play (superset of
        # sources); fossDebug is assembled too so a GMS reference leaking into main/foss
        # sources fails CI immediately.
        run: ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kanarek-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn
