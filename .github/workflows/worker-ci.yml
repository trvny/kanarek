name: Worker CI

# Check only. Production deploys are owned by Cloudflare Workers Builds and are
# triggered from worker/** changes on main, so GitHub Actions must not deploy the
# same Worker a second time.
on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "!worker/**/*.md"
      - ".github/scripts/sync-default-feeds.mjs"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "!worker/**/*.md"
      - ".github/scripts/sync-default-feeds.mjs"
      - ".github/workflows/worker-ci.yml"
  workflow_dispatch:

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check default feed sync
        run: node .github/scripts/sync-default-feeds.mjs --check

      - name: Typecheck and test
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test
