name: Repack v0.0.6 hotfix APKs

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths: [".github/workflows/repack-v0.0.6.yml"]

permissions:
  contents: write

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test "$version" = "0.0.6" || {
            echo "::error::Expected app version 0.0.6, got $version"
            exit 1
          }
          gh release view v0.0.6 --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Read Gradle version
        id: gradle
        run: |
          version=$(sed -n 's#^distributionUrl=.*/gradle-\([0-9][A-Za-z0-9.-]*\)-\(bin\|all\)\.zip$#\1#p' gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$version" ]; then
            echo "::error::could not parse Gradle version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
          cache-disabled: true

      - name: Generate Gradle wrapper
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is not configured."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Replace v0.0.6 APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app/build/outputs/apk/play/release/app-play-release.apk kanarek-0.0.6.apk
          mv app/build/outputs/apk/foss/release/app-foss-release.apk kanarek-0.0.6-foss.apk
          gh release upload v0.0.6 \
            kanarek-0.0.6.apk \
            kanarek-0.0.6-foss.apk \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Move release tag to this hotfix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.0.6" \
            -f sha="$GITHUB_SHA" \
            -F force=true
          gh release view v0.0.6 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,assets

      - name: Record repack success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          content="$(printf '%s\n' "$GITHUB_SHA" | base64 -w0)"
          gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.github/repack-v0.0.6.done" \
            -f message="ci: mark v0.0.6 repack complete" \
            -f content="$content"
