name: KMP iOS CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "gradle/**"
      - "gradle.properties"
      - "*.gradle.kts"
      - ".github/workflows/kmp-ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "shared/**"
      - "gradle/**"
      - "gradle.properties"
      - "*.gradle.kts"
      - ".github/workflows/kmp-ios-ci.yml"

concurrency:
  group: kmp-ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Read the Gradle version from the wrapper properties
        id: gradle
        run: |
          distribution_url=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2-)
          version=${distribution_url##*gradle-}
          version=${version%-bin.zip}
          version=${version%-all.zip}
          if [ -z "$version" ] || [ "$version" = "$distribution_url" ]; then
            echo "::error::could not parse a Gradle version out of gradle-wrapper.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Test shared iOS target
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
