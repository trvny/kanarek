name: Release

on: # yamllint disable-line rule:truthy
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: release
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag must point to a commit already merged into main."
            exit 1
          fi

          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::app/build.gradle.kts must declare a semantic version such as 1.0.0."
            exit 1
          fi
          if ! printf '%s\n' "$version_code" | grep -Eq '^[0-9]+$'; then
            echo "::error::app/build.gradle.kts must declare a numeric versionCode."
            exit 1
          fi

          expected_tag="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version (expected $expected_tag)."
            exit 1
          fi

          previous_tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            previous_code="$(git show "${previous_tag}:app/build.gradle.kts" | sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' | head -1)"
            if ! printf '%s\n' "$previous_code" | grep -Eq '^[0-9]+$'; then
              echo "::error::Could not read versionCode from $previous_tag."
              exit 1
            fi
            if [ "$version_code" -le "$previous_code" ]; then
              echo "::error::versionCode must increase (current $version_code, $previous_tag had $previous_code)."
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "## What's Changed"
            if [ -n "$PREVIOUS_TAG" ]; then
              notes="$(git log --no-merges "$PREVIOUS_TAG..HEAD" --pretty=format:'* %s' -- app)"
              if [ -n "$notes" ]; then
                printf '%s\n' "$notes"
              else
                echo "* Kanarek release maintenance."
              fi
            else
              echo "* Kanarek $RELEASE_VERSION release."
            fi
          } > release-notes.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Read Gradle version
        id: gradle
        run: |
          version=$(sed -n 's#^distributionUrl=.*/gradle-\([0-9][A-Za-z0-9.-]*\)-\(bin\|all\)\.zip$#\1#p' gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$version" ]; then
            echo "::error::could not parse a Gradle version out of gradle-wrapper.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
          cache-disabled: true

      - name: Generate Gradle wrapper
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon

      - name: Validate release tree
        run: ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is not configured."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename release APKs
        # These filenames exist only when the signing env above reached Gradle. If it did not,
        # AGP emits *-unsigned.apk and this step fails closed instead of publishing it.
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mv app/build/outputs/apk/play/release/app-play-release.apk \
             "app/build/outputs/apk/play/release/kanarek-${RELEASE_VERSION}.apk"
          mv app/build/outputs/apk/foss/release/app-foss-release.apk \
             "app/build/outputs/apk/foss/release/kanarek-${RELEASE_VERSION}-foss.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Kanarek ${{ steps.release.outputs.version }}
          body_path: release-notes.md
          files: app/build/outputs/apk/*/release/kanarek-*.apk
