name: Rolling release

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: kanarek-rolling-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve app version
        id: release
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::app/build.gradle.kts must declare a semantic version."
            exit 1
          fi
          if ! printf '%s\n' "$version_code" | grep -Eq '^[0-9]+$'; then
            echo "::error::app/build.gradle.kts must declare a numeric versionCode."
            exit 1
          fi
          {
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Read Gradle version
        id: gradle
        run: |
          version=$(sed -n 's#^distributionUrl=.*/gradle-\([0-9][A-Za-z0-9.-]*\)-\(bin\|all\)\.zip$#\1#p' gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$version" ]; then
            echo "::error::could not parse a Gradle version out of gradle-wrapper.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
          cache-disabled: true

      - name: Generate Gradle wrapper
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon

      - name: Validate release tree
        run: ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is not configured."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/play/release/app-play-release.apk dist/kanarek.apk
          cp app/build/outputs/apk/foss/release/app-foss-release.apk dist/kanarek-foss.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="kanarek-latest"

          cat > release-notes.md <<EOF
          Signed Android builds from \`${GITHUB_SHA}\`.

          Rolling release. Assets are replaced after each successful build of \`main\`.
          App version: \`${RELEASE_VERSION}\`.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" \
              -F force=true
            gh release edit "$tag" \
              --title "Kanarek · rolling" \
              --notes-file release-notes.md
          else
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Kanarek · rolling" \
              --notes-file release-notes.md
          fi

          gh release upload "$tag" \
            dist/kanarek.apk \
            dist/kanarek-foss.apk \
            --clobber
          gh release edit "$tag" --draft=false --latest

          # Keep the immutable version tag for source/F-Droid history, but retire
          # the superseded numbered GitHub release.
          gh release delete v0.0.6 --yes 2>/dev/null || true
