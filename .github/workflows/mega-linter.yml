---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: MegaLinter & secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/cupcake@15e5b45552097e318c93de385779ce3b1084052c # v10
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: "true"
          APPLY_FIXES_EVENT: none

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate MegaLinter
        if: always()
        env:
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
        run: |
          if [ "$MEGALINTER_OUTCOME" != "success" ]; then
            echo "MegaLinter reported blocking errors"
            exit 1
          fi
