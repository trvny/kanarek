---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: MegaLinter & secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/cupcake@v10
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none
          REPOSITORY_TRUFFLEHOG_ARGUMENTS: >-
            git file://.
            --since-commit
            ${{ github.event.pull_request.base.sha || github.event.before }}
            --branch
            ${{ github.event.pull_request.head.sha || github.event.after }}
            --fail
            --no-update
            --github-actions
            --results=verified,unknown

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate MegaLinter
        if: always()
        env:
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
        run: |
          if [ "$MEGALINTER_OUTCOME" != "success" ]; then
            echo "MegaLinter reported blocking errors"
            exit 1
          fi
